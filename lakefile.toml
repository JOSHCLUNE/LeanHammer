name = "Hammer"
precompileModules = true
preferReleaseBuild = true
defaultTargets = ["Hammer"]
testDriver = "HammerTest"

[[require]]
name = "«premise-selection»"
git = "https://github.com/hanwenzhu/premise-selection"
rev = "d25e7b41f0afe92bcbc4be2fec7724eac120fbe0"

[[require]]
name = "«aesop»"
git = "https://github.com/leanprover-community/aesop"
rev = "v4.32.0"

[[require]]
name = "«Duper»"
git = "https://github.com/leanprover-community/duper.git"
rev = "2644270a98b55a3b2939abac90f84d415cf9dca0"

[[require]]
name = "«Smt»"
git = "https://github.com/JOSHCLUNE/lean-smt.git"
rev = "a889a7c3bf2547511cf0a532d68713a743b7e2e9"
# git = "https://github.com/ufmg-smite/lean-smt.git"
# rev = "d114534c023806a1cb91e868547acc867a2779af" # no_mathlib branch

[[lean_lib]]
name = "Hammer"

# Not in `defaultTargets`, so a plain `lake build` stays unaffected; run these with `lake test`.
[[lean_lib]]
name = "HammerTest"
globs = ["HammerTest.+"]
